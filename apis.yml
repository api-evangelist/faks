aid: faks
name: Faks
description: >-
  Faks is a French SaaS platform that digitizes and streamlines the commercial
  relationships across the pharmacy ecosystem. It gives pharmacies, pharmacy
  groups (groupements), and laboratories a single place to manage supplier
  relationships, commercial claims and disputes (litiges), expired and returnable
  product handling, promotions, and sell-in / sell-out performance. Faks connects
  to pharmacy management systems (LGO), purchasing platforms, and accounting tools
  through its Konnect integrations to automate what has traditionally been manual,
  paper, and email-driven work between the ~18,000 pharmacies, ~100 groups, and
  ~500 laboratories it targets in France. The company is backed by Seedcamp. Faks
  does not currently publish a public developer API, OpenAPI, or developer portal;
  this profile captures its public identity and the enrichment surfaces that could
  be probed.
